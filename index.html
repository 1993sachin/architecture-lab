<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta

      content="Interactive experiments for understanding software architecture, system design, resilience, performance, and engineering trade-offs."
    />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      try {
        var stored = JSON.parse(localStorage.getItem('architecture-lab:theme') || 'null')
        var theme = stored && stored.state && stored.state.theme
        if (theme === 'light') document.documentElement.classList.remove('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
